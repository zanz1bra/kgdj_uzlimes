<!DOCTYPE html>
<html lang="lv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KGDJ Uzlīmju Karte</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" />
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" type="image/png" href="./KGDJ_logo_large.png">
</head>
<body>
<div id="app">
  <header>
    <div class="brand">
      <div class="brand-logo" id="logo-container">
        <img src="./KGDJ_logo_large.png" alt="KGDJ logo">
      </div>
      <div>
        <h1>Uzlīmju Jēzus</h1>
        <div class="tagline">Nes Jēzus gaismu pasaulē un meklē to dzīves tumšajos brīžos</div>
      </div>
    </div>
  </header>

  <div id="map-wrap">
    <div id="map"></div>
    <div id="add-hint">Aktivizē “+” un klikšķini kartē, lai pievienotu punktu</div>
    <div id="fab-add">+</div>
    <div id="fab-list">Saraksts</div>
    <div id="conn-badge">Savienojums…</div>
  </div>

  <div id="modal" class="modal-overlay">
    <div class="modal-card">
      <h2>Uzlīmju punkti</h2>
      <div id="point-list"></div>
      <div class="modal-close">
        <button onclick="closeList()">Aizvērt</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.47.0"></script>
<script>
  const SUPABASE_URL = 'https://vshfjwueojruorxkltyu.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_has7Gz7VgorBjFV9PAH2jQ_F7caqPav';

  let supabase;
  let map;
  let markers = new Map();
  let pointsCache = [];
  let addMode = false;
  let lightboxPhotos = [];
  let lightboxIndex = 0;

  const customIcon = L.icon({
    iconUrl: 'https://raw.githubusercontent.com/zanz1bra/logo/main/KGDJ_logo_large.png',
    iconSize: [60, 60],
    iconAnchor: [30, 60],
    popupAnchor: [0, -60]
  });

  window.addEventListener('load', () => {
    supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    initMap();
  });

  function escapeHtml(value) {
    return String(value ?? '').replace(/[&<>'"]/g, (char) => ({
      '&': '&amp;',
      '<': '&lt;',
      '>': '&gt;',
      '"': '&quot;',
      "'": '&#39;'
    }[char]));
  }

  function setAddMode(nextState) {
    addMode = nextState;
    document.getElementById('fab-add').classList.toggle('active', addMode);
    document.getElementById('add-hint').textContent = addMode
      ? 'Klikšķini kartē, lai pievienotu punktu'
      : 'Aktivizē “+” un klikšķini kartē, lai pievienotu punktu';
  }

  function clearMarkers() {
    markers.forEach((marker) => map.removeLayer(marker));
    markers.clear();
  }

  function initMap() {
    map = L.map('map').setView([56.95, 24.10], 5);
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap'
    }).addTo(map);

    fetchPoints();

    map.on('click', e => {
      if (!addMode) return;
      createPoint(e.latlng);
    });

    document.getElementById('fab-add').addEventListener('click', () => setAddMode(!addMode));
    document.getElementById('fab-list').addEventListener('click', openList);
  }

  async function fetchPoints() {
    try {
      const { data, error } = await supabase.from('points').select('*');
      if (error) throw error;
      pointsCache = data || [];
      renderPoints(pointsCache);
      document.getElementById('conn-badge').textContent = 'Savienots ✓';
    } catch (e) {
      console.error('Error fetching points:', e);
      document.getElementById('conn-badge').textContent = 'Savienojums neizdevās';
    }
  }

function renderPoints(points) {
  clearMarkers();
  points.forEach(p => {
    const marker = L.marker([p.lat, p.lng], { icon: customIcon }).addTo(map);
    markers.set(p.id, marker);
    marker.bindPopup(popupHtml(p));

    marker.on('popupopen', () => {
      loadPhotos(p.id);
    });
  });
}

  function popupHtml(p) {
    const safeName = escapeHtml(p.name || '');
    const safeNote = escapeHtml(p.note || '');

    return `
      <div>
        <div class="pop-label">Nosaukums</div>
        <input class="pop-input" id="name-${p.id}" value="${safeName}" placeholder="Uzlīmes vieta">
        <div class="pop-label">Komentārs</div>
        <input class="pop-input" id="note-${p.id}" value="${safeNote}" placeholder="Kādu komentāru?">

        <div class="pop-label" style="margin-top:10px;">Pievienot foto (.jpg)</div>
        <input class="pop-input" type="file" id="photo-file-${p.id}" accept=".jpg,.jpeg,image/jpeg">
        <button class="btn-pop" style="background:#2563eb;color:white;" onclick="uploadPhoto('${p.id}')">Augšupielādēt foto</button>

        <div id="photos-${p.id}" style="margin-top:10px;font-size:13px;">Ielādē foto...</div>

        <button class="btn-pop btn-save" onclick="savePoint('${p.id}')">Saglabāt</button>
        <button class="btn-pop btn-delete" onclick="deletePoint('${p.id}')">Dzēst punktu</button>
      </div>
    `;
  }

  function removePointFromUI(id) {
    const marker = markers.get(id);
    if (marker) {
      marker.closePopup();
      if (map.hasLayer(marker)) {
        map.removeLayer(marker);
      }
      markers.delete(id);
    }

    pointsCache = pointsCache.filter(p => p.id !== id);

    if (document.getElementById('modal').style.display === 'flex') {
      buildListFromCache();
    }
  }

  async function savePoint(id) {
    const name = document.getElementById(`name-${id}`).value || '';
    const note = document.getElementById(`note-${id}`).value || '';

    const marker = markers.get(id);
    if (!marker) return;

    const { lat, lng } = marker.getLatLng();

    const { error } = await supabase
      .from('points')
      .update({ lat, lng, name, note })
      .eq('id', id);

    if (error) {
      console.error('Error updating point:', error);
      return;
    }

    await fetchPoints();
  }

  async function deletePoint(id) {
    const ok = window.confirm('Vai tiešām dzēst šo punktu?');
    if (!ok) return;

    removePointFromUI(id);

    const { error } = await supabase
      .from('points')
      .delete()
      .eq('id', id);

    if (error) {
      console.error('Error deleting point:', error);
      await fetchPoints();
    }
  }

async function fileToBase64(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => {
        const result = reader.result || "";
        const base64 = String(result).split(",")[1] || "";
        resolve(base64);
      };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  async function uploadPhoto(pointId) {
    const input = document.getElementById(`photo-file-${pointId}`);
    const box = document.getElementById(`photos-${pointId}`);

    if (!input || !input.files || !input.files[0]) {
      alert("Lūdzu izvēlies .jpg failu.");
      return;
    }

    const file = input.files[0];
    const nameLower = (file.name || "").toLowerCase();

    if (!(nameLower.endsWith(".jpg") || nameLower.endsWith(".jpeg"))) {
      alert("Atļauti tikai .jpg faili.");
      return;
    }

    if (file.size > 10 * 1024 * 1024) {
      alert("Fails ir par lielu. Maksimums 10MB.");
      return;
    }

    try {
      box.textContent = "Notiek augšupielāde...";

      const fileBase64 = await compressImageToJpegBase64(file, 1600, 1600, 0.82);

      const res = await fetch("/.netlify/functions/upload-photo", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          pointId,
          fileName: file.name,
          fileBase64
        })
      });

      const data = await res.json();

      if (!res.ok) {
        throw new Error(data.error || "Upload failed");
      }

      input.value = "";
      await loadPhotos(pointId);
    } catch (e) {
      box.textContent = "Kļūda augšupielādē.";
      alert(`Augšupielādes kļūda: ${e.message}`);
    }
  }

  async function loadPhotos(pointId) {
    const box = document.getElementById(`photos-${pointId}`);
    if (!box) return;

    try {
      box.textContent = "Ielādē foto...";

      const res = await fetch(`/.netlify/functions/get-point-photos?pointId=${encodeURIComponent(pointId)}`);
      const data = await res.json();

      if (!res.ok) {
        throw new Error(data.error || "Failed to load photos");
      }

      const photos = data.photos || [];
      const urls = photos.map(p => p.photo_url);

      if (!photos.length) {
        box.textContent = "Šim punktam vēl nav foto.";
        return;
      }

          box.innerHTML = `
            <div style="
              max-height: 230px;   /* ~4 rows depending on popup width */
              overflow-y: auto;
              padding-right: 4px;
              margin-top: 6px;
            ">
              <div style="
                display:grid;
                grid-template-columns:repeat(auto-fill,minmax(92px,1fr));
                gap:8px;
                max-height: 230px;
                overflow-y: auto;
                overflow-x: hidden;
                padding-right: 4px;
                margin-top: 6px;
              ">
                ${photos.map(ph => `
                  <div style="
                    border:1px solid #e5e7eb;
                    border-radius:10px;
                    padding:6px;
                    background:#fff;
                  ">
                    <img
                      src="${ph.photo_url}"
                      alt="point photo"
                      loading="lazy"
                      decoding="async"
                      fetchpriority="low"
                      onclick='openLightbox("${ph.photo_url}", ${JSON.stringify(urls)})'
                      style="
                        width:100%;
                        aspect-ratio:1/1;
                        object-fit:cover;
                        border-radius:8px;
                        display:block;
                        cursor:zoom-in;
                      "
                    />
                    <button
                      style="
                        margin-top:6px;
                        width:100%;
                        background:#dc2626;
                        color:#fff;
                        border:none;
                        border-radius:7px;
                        padding:6px 8px;
                        cursor:pointer;
                        font-size:12px;
                      "
                      onclick="deletePhoto('${ph.id}','${pointId}')"
                    >
                      Dzēst foto
                    </button>
                  </div>
                `).join("")}
              </div>
            </div>
          `;
    } catch (e) {
      box.textContent = "Neizdevās ielādēt foto.";
    }
  }

  async function compressImageToJpegBase64(file, maxW = 1600, maxH = 1600, quality = 0.82) {
  const dataUrl = await new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => resolve(r.result);
    r.onerror = reject;
    r.readAsDataURL(file);
  });

  const img = await new Promise((resolve, reject) => {
    const i = new Image();
    i.onload = () => resolve(i);
    i.onerror = reject;
    i.src = dataUrl;
  });

  let { width, height } = img;
  const ratio = Math.min(maxW / width, maxH / height, 1); // never upscale
  const targetW = Math.round(width * ratio);
  const targetH = Math.round(height * ratio);

  const canvas = document.createElement("canvas");
  canvas.width = targetW;
  canvas.height = targetH;

  const ctx = canvas.getContext("2d");
  ctx.drawImage(img, 0, 0, targetW, targetH);

  const outDataUrl = canvas.toDataURL("image/jpeg", quality);
  return outDataUrl.split(",")[1]; // base64 only
}

  async function deletePhoto(photoId, pointId) {
  const ok = confirm("Vai tiešām dzēst šo foto?");
  if (!ok) return;

  const box = document.getElementById(`photos-${pointId}`);
  if (box) box.textContent = "Dzēš foto...";

  try {
    const res = await fetch("/.netlify/functions/delete-photo", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ photoId })
    });

    const data = await res.json();
    if (!res.ok) throw new Error(data.error || "Delete failed");

    await loadPhotos(pointId);
  } catch (e) {
    if (box) box.textContent = "Kļūda dzēšot foto.";
    alert(`Dzēšanas kļūda: ${e.message}`);
  }
}

  async function createPoint(latlng) {
    const id = crypto.randomUUID();
    const p = {
      id,
      lat: latlng.lat,
      lng: latlng.lng,
      name: '',
      note: '',
      seen: false
    };

    const { error } = await supabase.from('points').insert([p]);
    if (error) {
      console.error('Error creating point:', error);
      return;
    }

    setAddMode(false);
    await fetchPoints();

    const marker = markers.get(id);
    if (marker) marker.openPopup();
  }

  function openList() {
    document.getElementById('modal').style.display = 'flex';
    buildList();
  }

  async function buildList() {
    try {
      const { data, error } = await supabase.from('points').select('*');
      if (error) throw error;
      pointsCache = data || [];
      buildListFromCache();
    } catch (e) {
      console.error('Error building list:', e);
      document.getElementById('point-list').innerHTML = '<div class="point-item">Neizdevās ielādēt punktus.</div>';
    }
  }

  function buildListFromCache() {
    const points = pointsCache || [];
    const list = document.getElementById('point-list');
    list.innerHTML = '';

    if (points.length === 0) {
      list.innerHTML = '<div class="point-item">Vēl nav neviena punkta.</div>';
      return;
    }

    points.forEach(p => {
      const div = document.createElement('div');
      div.className = 'point-item';
      div.innerHTML = `
        <div><b>${escapeHtml(p.name || 'Bez nosaukuma')}</b></div>
        <div class="point-meta">${escapeHtml(p.note || '')}</div>
      `;
      div.onclick = () => {
        document.getElementById('modal').style.display = 'none';
        const m = markers.get(p.id);
        if (m) {
          map.setView([p.lat, p.lng], 10);
          m.openPopup();
        }
      };
      list.appendChild(div);
    });
  }

  function closeList() {
    document.getElementById('modal').style.display = 'none';
  }

  function openLightbox(url, photos = []) {
    lightboxPhotos = photos.length ? photos : [url];
    lightboxIndex = Math.max(0, lightboxPhotos.indexOf(url));
    if (lightboxIndex < 0) lightboxIndex = 0;
    renderLightboxImage();

    const box = document.getElementById("imgLightbox");
    box.style.display = "flex";
  }

  function renderLightboxImage() {
    const img = document.getElementById("imgLightboxSrc");
    const counter = document.getElementById("imgLightboxCounter");
    if (!lightboxPhotos.length) return;
    img.src = lightboxPhotos[lightboxIndex];
    if (counter) counter.textContent = `${lightboxIndex + 1} / ${lightboxPhotos.length}`;
  }

  function prevLightbox() {
    if (!lightboxPhotos.length) return;
    lightboxIndex = (lightboxIndex - 1 + lightboxPhotos.length) % lightboxPhotos.length;
    renderLightboxImage();
  }

  function nextLightbox() {
    if (!lightboxPhotos.length) return;
    lightboxIndex = (lightboxIndex + 1) % lightboxPhotos.length;
    renderLightboxImage();
  }

  function closeLightbox() {
    const box = document.getElementById("imgLightbox");
    const img = document.getElementById("imgLightboxSrc");
    box.style.display = "none";
    img.src = "";
    lightboxPhotos = [];
    lightboxIndex = 0;
  }

// optional: click dark background to close
document.addEventListener("click", (e) => {
  const box = document.getElementById("imgLightbox");
  if (!box || box.style.display !== "flex") return;
  if (e.target.id === "imgLightbox") closeLightbox();
});

// optional: ESC key to close
document.addEventListener("keydown", (e) => {
  const box = document.getElementById("imgLightbox");
  if (!box || box.style.display !== "flex") return;

  if (e.key === "Escape") closeLightbox();
  if (e.key === "ArrowLeft") prevLightbox();
  if (e.key === "ArrowRight") nextLightbox();
});
</script>
  <div id="imgLightbox" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:9999;align-items:center;justify-content:center;padding:20px;">
    <button onclick="closeLightbox()" style="position:absolute;top:16px;right:16px;background:#111;color:#fff;border:1px solid #444;border-radius:8px;padding:8px 10px;cursor:pointer;">✕</button>

    <button onclick="prevLightbox()" style="position:absolute;left:16px;top:50%;transform:translateY(-50%);background:#111;color:#fff;border:1px solid #444;border-radius:999px;width:42px;height:42px;cursor:pointer;">←</button>
    <img id="imgLightboxSrc" src="" alt="full" style="max-width:92vw;max-height:86vh;border-radius:10px;box-shadow:0 10px 40px rgba(0,0,0,.45);" />
    <button onclick="nextLightbox()" style="position:absolute;right:16px;top:50%;transform:translateY(-50%);background:#111;color:#fff;border:1px solid #444;border-radius:999px;width:42px;height:42px;cursor:pointer;">→</button>

    <div id="imgLightboxCounter" style="position:absolute;bottom:16px;left:50%;transform:translateX(-50%);color:#fff;background:rgba(0,0,0,.45);padding:6px 10px;border-radius:999px;font-size:13px;">1 / 1</div>
  </div>
</body>
</html>
