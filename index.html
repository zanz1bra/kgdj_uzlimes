<style>
  :root{
    --ink:#1b1918;
    --paper:#f4efe4;
    --paper2:#ece4d2;
    --red:#e30016;
    --purple:#9933cc;
    --line:rgba(27,25,24,0.18);
    --white:#ffffff;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;padding:0;font-family:'Space Grotesk',system-ui,sans-serif;background:var(--ink);color:var(--ink);}
  #app{display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden;}

  header{
    background:var(--ink);color:var(--paper);
    padding:10px 16px;display:flex;align-items:center;justify-content:space-between;
    gap:10px;border-bottom:3px solid var(--red);z-index:20;flex-wrap:wrap;
  }
  .brand{display:flex;align-items:center;gap:10px;min-width:0;}
  .brand-badge{width:34px;height:34px;border-radius:50%;background:var(--red);border:2px solid var(--paper);flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-family:'Anton',sans-serif;font-size:11px;color:var(--ink);letter-spacing:0.5px;}
  .brand h1{font-family:'Anton', sans-serif;font-weight:400;font-size:19px;letter-spacing:0.5px;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .brand .tagline{font-size:11px;opacity:0.65;margin-top:1px;white-space:nowrap;}
  .header-actions{display:flex;align-items:center;gap:8px;}
  .stat-pill{background:var(--paper);color:var(--ink);font-size:12px;font-weight:600;padding:5px 10px;border-radius:20px;display:flex;gap:5px;align-items:center;white-space:nowrap;}
  .stat-pill b{color:var(--red);font-family:'Anton',sans-serif;font-weight:400;font-size:13px;}
  button{font-family:'Space Grotesk',sans-serif;cursor:pointer;border:none;outline:none;}
  .btn-ghost{background:transparent;color:var(--paper);border:1.5px solid rgba(244,239,228,0.4);padding:6px 12px;border-radius:20px;font-size:12px;font-weight:600;transition:all .15s;}
  .btn-ghost:hover{border-color:var(--paper);background:rgba(244,239,228,0.08);}

  #map-wrap{position:relative;flex:1;min-height:0;}
  #map{position:absolute;inset:0;background:var(--paper2); z-index:0;}
  /* Ensure popup style looks nice */
  .leaflet-popup-content-wrapper{background:var(--paper);border:2px solid var(--ink);border-radius:10px;box-shadow:3px 3px 0 var(--ink);}
  .leaflet-popup-tip{background:var(--paper);border:2px solid var(--ink);}
  .leaflet-popup-content{margin:12px 14px;min-width:220px;}
  .leaflet-container a.leaflet-popup-close-button{color:var(--ink);font-size:20px;}

  /* Controls (FAB / list / hint) — give them very high z-index so they sit above leaflet panes */
  #add-hint{
    position:absolute;top:14px;left:50%;transform:translateX(-50%);
    background:var(--ink);color:var(--paper);padding:8px 16px;border-radius:20px;
    font-size:12.5px;font-weight:600;z-index:99999;box-shadow:0 3px 10px rgba(0,0,0,0.3);
    display:flex;align-items:center;gap:8px;max-width:90%;text-align:center;pointer-events:auto;
  }
  #add-hint .dot{width:8px;height:8px;border-radius:50%;background:var(--red);flex:0 0 auto;animation:pulse 1.4s infinite;}
  @keyframes pulse{0%{opacity:1;}50%{opacity:.3;}100%{opacity:1;}}
  #add-hint.mode-on{background:var(--red);}
  #add-hint.mode-on .dot{background:var(--paper);}

  #fab-add{
    position:absolute;bottom:22px;right:16px;z-index:100000;background:var(--red);color:var(--paper);
    width:56px;height:56px;border-radius:50%;font-size:28px;font-weight:700;
    box-shadow:0 4px 14px rgba(0,0,0,0.4);display:flex;align-items:center;justify-content:center;
    transition:transform .15s, background .15s;line-height:0;pointer-events:auto;
  }
  #fab-add.active{background:var(--purple);transform:rotate(45deg);}
  #fab-add:active{transform:scale(0.92);}

  #fab-list{
    position:absolute;bottom:22px;left:16px;z-index:100000;background:var(--paper);color:var(--ink);
    border:2px solid var(--ink);padding:10px 16px;border-radius:24px;font-size:13px;font-weight:700;
    box-shadow:0 4px 14px rgba(0,0,0,0.3);display:flex;align-items:center;gap:6px;pointer-events:auto;
  }

  #conn-badge{
    position:absolute;top:14px;right:14px;z-index:100000;
    font-size:10.5px;font-weight:700;padding:4px 10px;border-radius:12px;
    background:var(--paper);color:var(--ink);opacity:0.95;pointer-events:auto;
  }
  #conn-badge.err{background:var(--red);color:var(--white);}

  .kgdj-marker{filter:drop-shadow(0 2px 4px rgba(0,0,0,0.5));transition:transform .12s;}
  .kgdj-marker:hover{transform:scale(1.12);}

  .pop-note{font-size:14px;font-weight:600;margin:0 0 6px;line-height:1.35;}
  .pop-meta{font-size:11.5px;opacity:0.7;margin-bottom:10px;}
  .pop-seen-title{font-size:11px;text-transform:uppercase;letter-spacing:0.5px;opacity:0.6;margin-bottom:4px;font-weight:700;}
  .pop-seen-list{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px;min-height:22px;}
  .seen-chip{background:var(--purple);color:var(--white);font-size:11px;font-weight:600;padding:3px 9px;border-radius:12px;display:flex;align-items:center;gap:4px;}
  .pop-empty{font-size:11.5px;opacity:0.5;font-style:italic;}
  .btn-seen{width:100%;background:var(--ink);color:var(--paper);padding:9px;border-radius:8px;font-size:12.5px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:6px;}
  .btn-seen.active{background:var(--red);}
  .btn-seen:disabled{opacity:0.6;}
  .btn-del{margin-top:6px;width:100%;background:transparent;color:var(--ink);opacity:0.45;padding:5px;border-radius:8px;font-size:10.5px;font-weight:600;text-decoration:underline;}

  .modal-overlay{position:fixed;inset:0;background:rgba(27,25,24,0.72);display:flex;align-items:center;justify-content:center;z-index:999999;padding:20px;}
