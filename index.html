<!DOCTYPE html>
<html lang="lv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KGDJ Uzlīmju Karte</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" />
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root{
      --ink:#1b1918;
      --paper:#f4efe4;
      --paper2:#ece4d2;
      --red:#e30016;
      --purple:#9933cc;
      --white:#ffffff;
    }

    *{box-sizing:border-box;}
    html,body{
      margin:0;padding:0;height:100%;
      background:var(--ink);
      font-family:'Space Grotesk',system-ui,sans-serif;
      color:var(--ink);
    }

    #app{
      display:flex;
      flex-direction:column;
      height:100vh;
      height:100dvh;
      overflow:hidden;
    }

    header{
      background:var(--ink);color:var(--paper);
      padding:10px 16px;
      display:flex;align-items:center;justify-content:space-between;
      gap:10px;border-bottom:3px solid var(--red);
      flex-wrap:wrap;
    }
    .brand{display:flex;align-items:center;gap:10px;}
    .brand-badge{
      width:34px;height:34px;border-radius:50%;
      background:var(--red);border:2px solid var(--paper);
      display:flex;align-items:center;justify-content:center;
      font-family:'Anton',sans-serif;font-size:11px;color:var(--ink);
      letter-spacing:0.5px;
    }
    .brand h1{
      font-family:'Anton',sans-serif;font-weight:400;
      font-size:19px;letter-spacing:0.5px;margin:0;
    }
    .brand .tagline{font-size:11px;opacity:0.7;margin-top:2px;}

    #map-wrap{
      position:relative;
      flex:1;
      min-height:0;
      z-index:0;
    }
    #map{
      position:absolute;
      inset:0;
      background:var(--paper2);
      z-index:1;
    }
    .leaflet-container{z-index:1 !important;}

    #add-hint{
      position:absolute;top:14px;left:50%;transform:translateX(-50%);
      background:var(--ink);color:var(--paper);
      padding:8px 16px;border-radius:20px;
      font-size:12px;font-weight:600;
      z-index:999999;pointer-events:none;
      opacity:0.9;
    }
    #fab-add{
      position:absolute;bottom:22px;right:16px;
      width:56px;height:56px;border-radius:50%;
      background:var(--red);color:var(--paper);
      font-size:28px;font-weight:700;
      display:flex;align-items:center;justify-content:center;
      z-index:999999;cursor:pointer;
      box-shadow:0 4px 14px rgba(0,0,0,0.4);
    }
    #fab-add.active{background:var(--purple);transform:rotate(45deg);}
    #fab-list{
      position:absolute;bottom:22px;left:16px;
      background:var(--paper);color:var(--ink);
      border:2px solid var(--ink);padding:10px 16px;
      border-radius:24px;font-size:13px;font-weight:700;
      z-index:999999;cursor:pointer;
      box-shadow:0 4px 14px rgba(0,0,0,0.3);
    }
    #conn-badge{
      position:absolute;top:14px;right:14px;
      background:var(--paper);color:var(--ink);
      padding:4px 10px;border-radius:12px;
      font-size:11px;font-weight:700;
      z-index:999999;
    }

    .leaflet-popup-content{min-width:230px;}
    .pop-label{font-size:12px;margin-bottom:4px;}
    .pop-input{width:100%;padding:6px 8px;font-size:12px;margin-bottom:8px;border:1px solid var(--ink);border-radius:6px;}
    .pop-row{display:flex;align-items:center;gap:6px;margin-bottom:8px;font-size:12px;}
    .btn-pop{
      width:100%;padding:8px;border-radius:8px;
      border:none;cursor:pointer;font-size:12px;font-weight:700;
      margin-bottom:6px;
    }
    .btn-save{background:var(--ink);color:var(--paper);}
    .btn-delete{background:transparent;color:var(--ink);text-decoration:underline;font-size:11px;}
    .btn-seen-toggle{background:var(--purple);color:var(--white);}

    /* modal for list */
    .modal-overlay{
      position:fixed;inset:0;background:rgba(0,0,0,0.6);
      display:none;align-items:center;justify-content:center;
      z-index:1000000;
    }
    .modal-card{
      background:var(--paper);border:2px solid var(--ink);
      border-radius:12px;max-width:420px;width:90%;
      padding:16px;
    }
    .modal-card h2{
      margin:0 0 8px;font-family:'Anton',sans-serif;font-size:18px;
    }
    .point-item{
      padding:8px 0;border-bottom:1px solid rgba(0,0,0,0.1);
      font-size:13px;
    }
    .point-meta{font-size:11px;opacity:0.7;}
    .chip-seen{
      display:inline-block;padding:2px 8px;border-radius:999px;
      background:var(--purple);color:var(--white);font-size:10px;margin-left:6px;
    }
    .modal-close{
      margin-top:10px;font-size:12px;text-align:right;
    }
    .modal-close button{
      border:none;background:transparent;color:var(--ink);
      text-decoration:underline;cursor:pointer;font-size:12px;
    }
  </style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand">
      <div class="brand-badge">KGDJ</div>
      <div>
        <h1>Uzlīmju Karte</h1>
        <div class="tagline">Cik tālu pasaulē aiznesta Jēzus gaisma</div>
      </div>
    </div>
  </header>

  <div id="map-wrap">
    <div id="map"></div>

    <div id="add-hint">Pieskaries kartē, lai pievienotu punktu</div>
    <div id="fab-add">+</div>
    <div id="fab-list">Saraksts</div>
    <div id="conn-badge">Savienojums…</div>
  </div>

  <div id="modal" class="modal-overlay">
    <div class="modal-card">
      <h2>Uzlīmju punkti</h2>
      <div id="point-list"></div>
      <div class="modal-close">
        <button onclick="closeList()">Aizvērt</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script>
  const API_URL = '/.netlify/functions/points'; // Netlify function, ko uztaisīsim
  let map;
  let markers = new Map(); // id -> marker
  let addMode = false;

  async function fetchPoints(){
    try{
      const res = await fetch(API_URL);
      if(!res.ok) throw new Error('API error');
      const data = await res.json();
      renderPoints(data);
      document.getElementById('conn-badge').textContent = 'Savienots ar GitHub';
    }catch(e){
      document.getElementById('conn-badge').textContent = 'Savienojums neizdevās';
    }
  }

  function renderPoints(points){
    markers.clear();
    points.forEach(p => {
      const marker = L.marker([p.lat, p.lng]).addTo(map);
      markers.set(p.id, marker);
      marker.bindPopup(popupHtml(p));
    });
  }

  function popupHtml(p){
    const seenText = p.seen ? 'checked' : '';
    return `
      <div>
        <div class="pop-label">Nosaukums</div>
        <input class="pop-input" id="name-${p.id}" value="${p.name || ''}" placeholder="Uzlīmes vieta">
        <div class="pop-label">Apraksts</div>
        <input class="pop-input" id="note-${p.id}" value="${p.note || ''}" placeholder="Piem., kurā pilsētā, kad uzzīmēta">
        <div class="pop-row">
          <input type="checkbox" id="seen-${p.id}" ${seenText}>
          <label for="seen-${p.id}">Redzēts dzīvē</label>
        </div>
        <button class="btn-pop btn-save" onclick="savePoint('${p.id}')">Saglabāt</button>
        <button class="btn-pop btn-seen-toggle" onclick="toggleSeen('${p.id}')">Pārslēgt “redzēts”</button>
        <button class="btn-pop btn-delete" onclick="deletePoint('${p.id}')">Dzēst punktu</button>
      </div>
    `;
  }

  async function savePoint(id){
    const name = document.getElementById(`name-${id}`).value || '';
    const note = document.getElementById(`note-${id}`).value || '';
    const seen = document.getElementById(`seen-${id}`).checked;

    const marker = markers.get(id);
    const {lat, lng} = marker.getLatLng();

    await fetch(API_URL, {
      method:'PUT',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({id, lat, lng, name, note, seen})
    });
    await fetchPoints();
  }

  async function toggleSeen(id){
    const marker = markers.get(id);
    const {lat, lng} = marker.getLatLng();
    const checkbox = document.getElementById(`seen-${id}`);
    const seen = !checkbox.checked;
    checkbox.checked = seen;

    const name = document.getElementById(`name-${id}`).value || '';
    const note = document.getElementById(`note-${id}`).value || '';

    await fetch(API_URL, {
      method:'PUT',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({id, lat, lng, name, note, seen})
    });
    await fetchPoints();
  }

  async function deletePoint(id){
    await fetch(API_URL, {
      method:'DELETE',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({id})
    });
    await fetchPoints();
  }

  async function createPoint(latlng){
    const id = crypto.randomUUID();
    const p = {
      id,
      lat: latlng.lat,
      lng: latlng.lng,
      name: '',
      note: '',
      seen: false
    };
    await fetch(API_URL, {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify(p)
    });
    await fetchPoints();
    const marker = markers.get(id);
    if(marker) marker.openPopup();
  }

  function openList(){
    document.getElementById('modal').style.display = 'flex';
    buildList();
  }

  async function buildList(){
    try{
      const res = await fetch(API_URL);
      const points = await res.json();
      const list = document.getElementById('point-list');
      list.innerHTML = '';
      if(points.length === 0){
        list.innerHTML = '<div class="point-item">Vēl nav neviena punkta.</div>';
        return;
      }
      points.forEach(p => {
        const div = document.createElement('div');
        div.className = 'point-item';
        div.innerHTML = `
          <div><b>${p.name || 'Bez nosaukuma'}</b>${p.seen ? '<span class="chip-seen">Redzēts</span>' : ''}</div>
          <div class="point-meta">${p.note || ''}</div>
        `;
        div.onclick = () => {
          document.getElementById('modal').style.display = 'none';
          const m = markers.get(p.id);
          if(m){
            map.setView([p.lat, p.lng], 10);
            m.openPopup();
          }
        };
        list.appendChild(div);
      });
    }catch(e){
      document.getElementById('point-list').innerHTML = '<div class="point-item">Neizdevās ielādēt punktus.</div>';
    }
  }

  function closeList(){
    document.getElementById('modal').style.display = 'none';
  }

  document.addEventListener('DOMContentLoaded', () => {
    map = L.map('map').setView([56.95, 24.10], 5);
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap'
    }).addTo(map);

    fetchPoints();

    map.on('click', e => {
      if(!addMode) return;
      createPoint(e.latlng);
    });

    document.getElementById('fab-add').addEventListener('click', () => {
      addMode = !addMode;
      document.getElementById('fab-add').classList.toggle('active', addMode);
      document.getElementById('add-hint').textContent = addMode
        ? 'Klikšķini kartē, lai pievienotu punktu'
        : 'Pieskaries kartē, lai pievienotu punktu';
    });

    document.getElementById('fab-list').addEventListener('click', openList);
  });
</script>
</body>
</html>
