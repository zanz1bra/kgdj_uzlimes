<!DOCTYPE html>
<html lang="lv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KGDJ Uzlīmju Karte</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" />
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  :root{
    --ink:#1b1918;
    --paper:#f4efe4;
    --paper2:#ece4d2;
    --red:#e30016;
    --purple:#9933cc;
    --white:#ffffff;
  }

  html,body{margin:0;padding:0;height:100%;background:var(--ink);font-family:'Space Grotesk',sans-serif;}

  #app{display:flex;flex-direction:column;height:100vh;overflow:hidden;}

  header{
    background:var(--ink);color:var(--paper);
    padding:10px 16px;border-bottom:3px solid var(--red);
    display:flex;align-items:center;gap:10px;
  }

  #map-wrap{position:relative;flex:1;min-height:0;z-index:0;}
  #map{position:absolute;inset:0;background:var(--paper2);z-index:1;}

  .leaflet-container{z-index:1 !important;}

  /* Floating UI */
  #add-hint{
    position:absolute;top:14px;left:50%;transform:translateX(-50%);
    background:var(--ink);color:var(--paper);
    padding:8px 16px;border-radius:20px;font-size:12px;
    z-index:999999;pointer-events:none; /* IMPORTANT FIX */
    opacity:0.85;
  }

  #fab-add{
    position:absolute;bottom:22px;right:16px;
    width:56px;height:56px;border-radius:50%;
    background:var(--red);color:var(--paper);
    font-size:28px;font-weight:700;
    display:flex;align-items:center;justify-content:center;
    z-index:999999;cursor:pointer;
  }

  #fab-list{
    position:absolute;bottom:22px;left:16px;
    background:var(--paper);color:var(--ink);
    border:2px solid var(--ink);padding:10px 16px;
    border-radius:24px;font-size:13px;font-weight:700;
    z-index:999999;cursor:pointer;
  }

  #conn-badge{
    position:absolute;top:14px;right:14px;
    background:var(--paper);color:var(--ink);
    padding:4px 10px;border-radius:12px;
    font-size:11px;font-weight:700;
    z-index:999999;
  }
</style>
</head>

<body>
<div id="app">

<header>
  <div class="brand-badge" style="background:var(--red);border:2px solid var(--paper);width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Anton';font-size:11px;color:var(--ink);">KGDJ</div>
  <h1 style="font-family:'Anton';font-size:20px;color:var(--paper);margin:0;">Uzlīmju Karte</h1>
</header>

<div id="map-wrap">
  <div id="map"></div>

  <div id="add-hint">Pieskaries kartē, lai pievienotu punktu</div>
  <div id="fab-add">+</div>
  <div id="fab-list">Saraksts</div>
  <div id="conn-badge">Savienots</div>
</div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>

<script>
  /* --- INITIALIZE MAP --- */
  const map = L.map('map').setView([56.95, 24.10], 5);

  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '&copy; OpenStreetMap'
  }).addTo(map);

  /* --- REMOVE STATIC RIGA MARKER --- */
  // (Deleted)

  /* --- ADD MARKER ON MAP CLICK --- */
  map.on("click", function(e){
    const marker = L.marker(e.latlng).addTo(map);
    marker.bindPopup("Jauns punkts!").openPopup();
  });

  /* --- BUTTON: ADD MODE --- */
  document.getElementById("fab-add").addEventListener("click", function(){
    alert("Šeit tu varēsi pievienot punktu ar formu (vēl nav ieviests).");
  });

  /* --- BUTTON: LIST --- */
  document.getElementById("fab-list").addEventListener("click", function(){
    alert("Šeit būs punktu saraksts (vēl nav ieviests).");
  });
</script>

</body>
</html>
