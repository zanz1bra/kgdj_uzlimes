<!DOCTYPE html>
<html lang="lv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KGDJ Uzlīmju Karte</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" />
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root{
      --ink:#1b1918;
      --paper:#f4efe4;
      --paper2:#ece4d2;
      --red:#e30016;
      --purple:#9933cc;
      --white:#ffffff;
    }

    *{box-sizing:border-box;}
    html,body{
      margin:0;padding:0;height:100%;
      background:var(--ink);
      font-family: Geneva, Verdana, sans-serif;
      color:var(--ink);
    }

    #app{
      display:flex;
      flex-direction:column;
      height:100vh;
      height:100dvh;
      overflow:hidden;
    }

    header{
      background:var(--ink);color:var(--paper);
      padding:10px 16px;
      display:flex;align-items:center;justify-content:space-between;
      gap:10px;border-bottom:3px solid var(--red);
      flex-wrap:wrap;
    }
    .brand{display:flex;align-items:center;gap:10px;}
    .brand-logo{
      width:40px;height:40px;
      display:flex;align-items:center;justify-content:center;
    }
    .brand-logo svg{
      width:100%;height:100%;
    }
    .brand h1{
      font-family: Geneva, Verdana, sans-serif;font-weight:400;
      font-size:19px;letter-spacing:0.5px;margin:0;
    }
    .brand .tagline{font-size:11px;opacity:0.7;margin-top:2px;}

    #map-wrap{
      position:relative;
      flex:1;
      min-height:0;
      z-index:0;
    }
    #map{
      position:absolute;
      inset:0;
      background:var(--paper2);
      z-index:1;
    }
    .leaflet-container{z-index:1 !important;}

    #add-hint{
      position:absolute;top:14px;left:50%;transform:translateX(-50%);
      background:var(--ink);color:var(--paper);
      padding:8px 16px;border-radius:20px;
      font-size:12px;font-weight:600;
      z-index:999999;pointer-events:none;
      opacity:0.9;
    }
    #fab-add{
      position:absolute;bottom:22px;right:16px;
      width:56px;height:56px;border-radius:50%;
      background:var(--red);color:var(--paper);
      font-size:28px;font-weight:700;
      display:flex;align-items:center;justify-content:center;
      z-index:999999;cursor:pointer;
      box-shadow:0 4px 14px rgba(0,0,0,0.4);
    }
    #fab-add.active{background:var(--purple);transform:rotate(45deg);}
    #fab-list{
      position:absolute;bottom:22px;left:16px;
      background:var(--paper);color:var(--ink);
      border:2px solid var(--ink);padding:10px 16px;
      border-radius:24px;font-size:13px;font-weight:700;
      z-index:999999;cursor:pointer;
      box-shadow:0 4px 14px rgba(0,0,0,0.3);
    }
    #conn-badge{
      position:absolute;top:14px;right:14px;
      background:var(--paper);color:var(--ink);
      padding:4px 10px;border-radius:12px;
      font-size:11px;font-weight:700;
      z-index:999999;
    }

    .leaflet-popup-content{min-width:230px;}
    .pop-label{font-size:12px;margin-bottom:4px;}
    .pop-input{width:100%;padding:6px 8px;font-size:12px;margin-bottom:8px;border:1px solid var(--ink);border-radius:6px;}
    .pop-row{display:flex;align-items:center;gap:6px;margin-bottom:8px;font-size:12px;}
    .btn-pop{
      width:100%;padding:8px;border-radius:8px;
      border:none;cursor:pointer;font-size:12px;font-weight:700;
      margin-bottom:6px;
    }
    .btn-save{background:var(--ink);color:var(--paper);}
    .btn-delete{background:transparent;color:var(--ink);text-decoration:underline;font-size:11px;}

    /* modal for list */
    .modal-overlay{
      position:fixed;inset:0;background:rgba(0,0,0,0.6);
      display:none;align-items:center;justify-content:center;
      z-index:1000000;
    }
    .modal-card{
      background:var(--paper);border:2px solid var(--ink);
      border-radius:12px;max-width:420px;width:90%;
      padding:16px;
    }
    .modal-card h2{
      margin:0 0 8px;font-family:'Anton',sans-serif;font-size:18px;
    }
    .point-item{
      padding:8px 0;border-bottom:1px solid rgba(0,0,0,0.1);
      font-size:13px;
    }
    .point-meta{font-size:11px;opacity:0.7;}
    .modal-close{
      margin-top:10px;font-size:12px;text-align:right;
    }
    .modal-close button{
      border:none;background:transparent;color:var(--ink);
      text-decoration:underline;cursor:pointer;font-size:12px;
    }
  </style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand">
      <div class="brand-logo" id="logo-container">
        <svg width="40" height="40" viewBox="0 0 210 297" xmlns="http://www.w3.org/2000/svg"><defs/><g id="layer1"><g id="g1" transform="matrix(0.3527772,0,0,0.3527772,0.03975364,-0.06849993)"><path d="M 344.5127,339.755 A 93.7499,93.7499 0 0 1 378.8276,467.8198 93.7499,93.7499 0 1 1 344.5127,339.755 Z" style="fill:#ffffff;fill-rule:evenodd;stroke:#1b1918;stroke-width:4.5;stroke-linecap:butt;stroke-linejoin:miter;stroke-dasharray:none" id="path1"/><path d="M 340.4823,346.7358 A 85.6891,85.6891 0 0 1 371.8467,463.7893 85.6891,85.6891 0 1 1 340.4823,346.7358 Z" style="fill:none;stroke:#1b1918;stroke-width:2.9999;stroke-linecap:butt;stroke-linejoin:miter;stroke-dasharray:none" id="path2"/><path d="M 337.176,352.4625 A 79.0766,79.0766 0 0 1 366.1201,460.4831 79.0766,79.0766 0 1 1 337.176,352.4625 Z" style="fill:none;stroke:#1b1918;stroke-width:2.2499;stroke-linecap:butt;stroke-linejoin:miter;stroke-dasharray:none" id="path3"/><path d="M 334.2829,357.4736 A 73.2902,73.2902 0 0 1 361.109,457.5899 73.2902,73.2902 0 1 1 334.2829,357.4736 Z" style="fill:none;stroke:#1b1918;stroke-width:2.0001;stroke-linecap:butt;stroke-linejoin:miter;stroke-dasharray:none" id="path4"/><path d="m 331.7484,361.8635 a 68.2212,68.2212 0 0 1 24.9707,93.1919 68.2212,68.2212 0 1 1 -24.9707,-93.1919 z" style="fill:#9933cc;fill-rule:evenodd;stroke:#1b1918;stroke-width:1.5001;stroke-linecap:butt;stroke-linejoin:miter;stroke-dasharray:none" id="path5"/></g></g></svg>
      </div>
      <div>
        <h1>Ko gan darītu Jēzus ar uzlīmēm?</h1>
        <div class="tagline">Nestu savu gaismu pasaulē!</div>
      </div>
    </div>
  </header>

  <div id="map-wrap">
    <div id="map"></div>

    <div id="add-hint">Pieskaries kartē, lai pievienotu punktu</div>
    <div id="fab-add">+</div>
    <div id="fab-list">Saraksts</div>
    <div id="conn-badge">Savienojums…</div>
  </div>

  <div id="modal" class="modal-overlay">
    <div class="modal-card">
      <h2>Uzlīmju punkti</h2>
      <div id="point-list"></div>
      <div class="modal-close">
        <button onclick="closeList()">Aizvērt</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.47.0"></script>
<script>
  // Supabase configuration
  const SUPABASE_URL = 'https://vshfjwueojruorxkltyu.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_has7Gz7VgorBjFV9PAH2jQ_F7caqPav';
  
  let supabase;
  let map;
  let markers = new Map();
  let addMode = false;

  // Custom marker icon using the full KGDJ logo
  const customIcon = L.icon({
    iconUrl: 'https://raw.githubusercontent.com/zanz1bra/logo/main/KGDJ.png',
    iconSize: [50, 50],
    iconAnchor: [25, 50],
    popupAnchor: [0, -50]
  });

  // Wait for Supabase to load
  window.addEventListener('load', () => {
    supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    initMap();
  });

  function initMap() {
    map = L.map('map').setView([56.95, 24.10], 5);
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap'
    }).addTo(map);

    fetchPoints();

    map.on('click', e => {
      if(!addMode) return;
      createPoint(e.latlng);
    });

    document.getElementById('fab-add').addEventListener('click', () => {
      addMode = !addMode;
      document.getElementById('fab-add').classList.toggle('active', addMode);
      document.getElementById('add-hint').textContent = addMode
        ? 'Klikšķini kartē, lai pievienotu punktu'
        : 'Pieskaries kartē, lai pievienotu punktu';
    });

    document.getElementById('fab-list').addEventListener('click', openList);
  }

  async function fetchPoints(){
    try{
      const { data, error } = await supabase.from('points').select('*');
      if(error) throw error;
      renderPoints(data || []);
      document.getElementById('conn-badge').textContent = 'Savienots ✓';
    }catch(e){
      console.error('Error fetching points:', e);
      document.getElementById('conn-badge').textContent = 'Savienojums neizdevās';
    }
  }

  function renderPoints(points){
    markers.clear();
    points.forEach(p => {
      const marker = L.marker([p.lat, p.lng], { icon: customIcon }).addTo(map);
      markers.set(p.id, marker);
      marker.bindPopup(popupHtml(p));
    });
  }

  function popupHtml(p){
    return `
      <div>
        <div class="pop-label">Nosaukums</div>
        <input class="pop-input" id="name-${p.id}" value="${p.name || ''}" placeholder="Uzlīmes vieta">
        <div class="pop-label">Komentārs</div>
        <input class="pop-input" id="note-${p.id}" value="${p.note || ''}" placeholder="Kad un kas to atrada?">
        <button class="btn-pop btn-save" onclick="savePoint('${p.id}')">Saglabāt</button>
        <button class="btn-pop btn-delete" onclick="deletePoint('${p.id}')">Dzēst punktu</button>
      </div>
    `;
  }

  async function savePoint(id){
    const name = document.getElementById(`name-${id}`).value || '';
    const note = document.getElementById(`note-${id}`).value || '';

    const marker = markers.get(id);
    const {lat, lng} = marker.getLatLng();

    const { error } = await supabase
      .from('points')
      .update({ lat, lng, name, note })
      .eq('id', id);
    
    if(error) console.error('Error updating point:', error);
    await fetchPoints();
  }

  async function deletePoint(id){
    const { error } = await supabase
      .from('points')
      .delete()
      .eq('id', id);
    
    if(error) console.error('Error deleting point:', error);
    await fetchPoints();
  }

  async function createPoint(latlng){
    const id = crypto.randomUUID();
    const p = {
      id,
      lat: latlng.lat,
      lng: latlng.lng,
      name: '',
      note: '',
      seen: false
    };
    
    const { error } = await supabase.from('points').insert([p]);
    if(error) console.error('Error creating point:', error);
    
    await fetchPoints();
    const marker = markers.get(id);
    if(marker) marker.openPopup();
  }

  function openList(){
    document.getElementById('modal').style.display = 'flex';
    buildList();
  }

  async function buildList(){
    try{
      const { data, error } = await supabase.from('points').select('*');
      if(error) throw error;
      
      const points = data || [];
      const list = document.getElementById('point-list');
      list.innerHTML = '';
      if(points.length === 0){
        list.innerHTML = '<div class="point-item">Vēl nav neviena punkta.</div>';
        return;
      }
      points.forEach(p => {
        const div = document.createElement('div');
        div.className = 'point-item';
        div.innerHTML = `
          <div><b>${p.name || 'Bez nosaukuma'}</b></div>
          <div class="point-meta">${p.note || ''}</div>
        `;
        div.onclick = () => {
          document.getElementById('modal').style.display = 'none';
          const m = markers.get(p.id);
          if(m){
            map.setView([p.lat, p.lng], 10);
            m.openPopup();
          }
        };
        list.appendChild(div);
      });
    }catch(e){
      console.error('Error building list:', e);
      document.getElementById('point-list').innerHTML = '<div class="point-item">Neizdevās ielādēt punktus.</div>';
    }
  }

  function closeList(){
    document.getElementById('modal').style.display = 'none';
  }
</script>
</body>
</html>
